<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E7D4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Vereinsrangliste · SC Yellow Dot Maintal</title>
<style>
  :root{
    --bg:#F5F6F4; --surface:#FFFFFF; --ink:#16211C; --muted:#5E6B64;
    --border:#E3E6E1; --accent:#2E7D4F; --gold:#C8A24B; --zebra:#F1F3EE;
    --up:#2E7D4F; --down:#C4362F; --same:#8A938D; --new:#2563EB;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
  #banner{max-width:1120px;margin:0 auto;padding:18px 18px 0}
  #banner img{width:100%;max-height:170px;object-fit:contain;display:block}
  .layout{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:150px minmax(0,760px) 150px;gap:22px;justify-content:center;padding:20px 18px 60px}
  .center{min-width:0}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .spons{display:flex;flex-direction:column;gap:14px;padding-top:78px}
  .spons a,.spons img{display:block;width:100%}
  .spons img{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;height:auto;object-fit:contain}
  .seg{display:inline-flex;background:#EAEDE8;border-radius:10px;padding:4px;margin:6px 0 18px}
  .seg button{border:0;background:transparent;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--border)}
  td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:15px}
  tbody tr:nth-child(odd){background:var(--zebra)}
  tbody tr:last-child td{border-bottom:none}
  .pos{font-variant-numeric:tabular-nums;font-weight:700;width:42px;color:var(--muted)}
  tr.top1 .pos{color:var(--gold)} tr.top1{font-weight:700}
  .pts{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .cnt{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;width:64px}
  th.r{text-align:right}
  .trend{width:66px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .trend .up{color:var(--up)} .trend .down{color:var(--down)} .trend .same{color:var(--same)} .trend .new{color:var(--new);font-size:12px}
  .prev{width:70px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  .pname{color:var(--accent);cursor:pointer;font-weight:600}
  .pname:hover{text-decoration:underline}
  .gtag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:#b45309;background:#fdf1e0;border:1px solid #f2d9b4;border-radius:6px;padding:1px 6px;vertical-align:middle}
  .h2h-head{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 18px 8px;font-weight:700}
  #h2hSel{margin:0 18px;width:calc(100% - 36px);padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-size:15px}
  .h2h-card{margin:12px 18px 6px;background:var(--zebra);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;gap:14px}
  .h2h-card .nm{flex:1;font-weight:700;font-size:15px}
  .h2h-card .nm.r{text-align:right}
  .h2h-card .sc{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .h2h-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:6px}
  .h2h-stats{display:flex;gap:10px;margin:8px 18px 4px}
  .h2h-stats .st-item{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
  .h2h-stats .st-item .v{display:block;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .h2h-stats .st-item .l{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
  .foot{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .tourn-head{padding:13px 15px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--border);background:#FAFBFA}
  .tourn-head .date{color:var(--muted);font-size:13px;font-weight:500}
  .overlay{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50}
  .overlay.hidden{display:none}
  .modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
  .modal-head h3{margin:0;font-size:18px}
  .modal-head .x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
  .modal .mi{padding:6px 18px 14px;color:var(--muted);font-size:13px}
  @media (max-width:960px){
    .layout{grid-template-columns:1fr;max-width:760px}
    .spons{flex-direction:row;flex-wrap:wrap;justify-content:center;padding-top:0}
    .spons a,.spons img{width:auto}
    .spons img{max-width:130px;max-height:72px}
    .spons.left{order:2} .center{order:1} .spons.right{order:3}
  }
  @media (max-width:560px){ .hide-sm{display:none} td,th{padding:10px 10px} }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<!-- ============================================================= -->
<!--  Banner & Sponsoren am besten in der App unter                -->
<!--  Einstellungen -> "Öffentliche Rangliste" eintragen.          -->
<!--  (Die Werte hier dienen nur als Rückfall, falls nichts in der -->
<!--   App gesetzt ist.) Bilddateien mit ins GitHub-Verzeichnis    -->
<!--  hochladen; leere "" = wird nicht angezeigt.                  -->
<!-- ============================================================= -->
<script>
window.SITE = {
  banner: "",           // z. B. "banner.png"  — Bild ganz oben; leer lassen für keins
  bannerLink: "",       // optionaler Link beim Klick auf den Banner
  sponsorsLeft:  ["", "", "", ""],
  sponsorsLeftLinks:  ["", "", "", ""],
  sponsorsRight: ["", "", "", ""],
  sponsorsRightLinks: ["", "", "", ""],
};
</script>
<!-- ============================================================= -->

<div id="banner"></div>

<div class="layout">
  <aside class="spons left" id="sponsLeft"></aside>

  <main class="center">
    <header>
      <h1>Vereinsrangliste</h1>
      <span class="sub" id="updated"></span>
    </header>
    <p class="sub">Beste 4 Ergebnisse der letzten 10 Ranglistenturniere. Tipp: auf einen Namen tippen zeigt alle Turniere des Spielers.</p>

    <div class="seg" id="seg" style="display:none">
      <button data-view="ranking" class="on">Rangliste</button>
      <button data-view="turniere">Letzte 10 Turniere</button>
    </div>

    <div id="rankingView"><div class="card"><div class="empty">Lädt…</div></div></div>
    <div id="turniereView" style="display:none"></div>

    <div class="foot" id="foot">SC Yellow Dot Maintal e.V.</div>
  </main>

  <aside class="spons right" id="sponsRight"></aside>
</div>

<div id="playerModal" class="overlay hidden">
  <div class="modal">
    <div class="modal-head"><h3 id="pmName"></h3><button class="x" id="pmClose">&times;</button></div>
    <div class="mi" id="pmInfo"></div>
    <div id="pmBody" style="padding:0 0 6px"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const cfg = window.SUPABASE_CONFIG || {};
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function nfmt(n){ return Number(n||0).toLocaleString("de-DE"); }
function fdate(d){ if(!d) return ""; const p=String(d).slice(0,10).split("-"); return p.length===3?p[2]+"."+p[1]+"."+p[0]:d; }

// ---------- Banner & Sponsoren ----------
function sponsorHTML(file, link){
  if(!file) return "";
  const img = '<img src="'+esc(file)+'" alt="Sponsor" loading="lazy" onerror="this.parentNode&&this.parentNode.classList.contains(\'sp\')?this.parentNode.remove():this.remove()">';
  return link ? '<a class="sp" href="'+esc(link)+'" target="_blank" rel="noopener">'+img+'</a>' : img;
}
function renderSite(){
  const S = window.SITE || {};
  if(S.banner){
    const img='<img src="'+esc(S.banner)+'" alt="" onerror="this.remove()">';
    $("#banner").innerHTML = S.bannerLink ? '<a href="'+esc(S.bannerLink)+'" target="_blank" rel="noopener">'+img+'</a>' : img;
  }
  const L=S.sponsorsLeft||[], LL=S.sponsorsLeftLinks||[], R=S.sponsorsRight||[], RL=S.sponsorsRightLinks||[];
  $("#sponsLeft").innerHTML  = L.map((f,i)=>sponsorHTML(f, LL[i])).join("");
  $("#sponsRight").innerHTML = R.map((f,i)=>sponsorHTML(f, RL[i])).join("");
}

let ALL_RESULTS=[];
let EVMAP={};
let ALL_H2H=[];
let CUR_H2H={}, CUR_NAME="";
function h2hFor(name){
  const map={};
  ALL_H2H.forEach(r=>{
    let opp=null, won=null, mS=0, oS=0, mB=0, oB=0;
    if(r.home_name===name){ opp=r.away_name; won=r.home_won; mS=r.home_sets; oS=r.away_sets; mB=r.home_balls; oB=r.away_balls; }
    else if(r.away_name===name){ opp=r.home_name; won=!r.home_won; mS=r.away_sets; oS=r.home_sets; mB=r.away_balls; oB=r.home_balls; }
    if(opp==null) return;
    const o=map[opp]=map[opp]||{w:0,l:0,sf:0,sa:0,bf:0,ba:0,games:[]};
    if(won) o.w++; else o.l++;
    o.sf+=(+mS||0); o.sa+=(+oS||0); o.bf+=(+mB||0); o.ba+=(+oB||0);
    o.games.push({won, mS:+mS||0, oS:+oS||0, mB:+mB||0, oB:+oB||0, ev:r.ev_name||"", date:r.ev_date||""});
  });
  return map;
}

function ranking(evIds, resByEvent){
  const byPlayer={};
  evIds.forEach(id => (resByEvent[id]||[]).forEach(r=>{ (byPlayer[r.name]=byPlayer[r.name]||[]).push(Number(r.points)); }));
  return Object.keys(byPlayer).map(name=>{
    const best4=byPlayer[name].slice().sort((a,b)=>b-a).slice(0,4);
    return { name:name, sum:best4.reduce((a,b)=>a+b,0), count:byPlayer[name].length };
  }).sort((a,b)=> b.sum-a.sum || a.name.localeCompare(b.name,"de"));
}
function trendCell(name, curPos, prevPos){
  const p = prevPos[name];
  if(p==null) return '<td class="trend"><span class="new">NEU</span></td>';
  const d = p - curPos;
  if(d>0)  return '<td class="trend"><span class="up">&#9650; '+d+'</span></td>';
  if(d<0)  return '<td class="trend"><span class="down">&#9660; '+(-d)+'</span></td>';
  return '<td class="trend"><span class="same">&#9679;</span></td>';
}
function pn(name){ const g=/\(Gast\)\s*$/.test(name); const clean=name.replace(/\s*\(Gast\)\s*$/,"");
  return '<span class="pname" data-player="'+esc(name)+'">'+esc(clean)+'</span>'+(g?' <span class="gtag">Gast</span>':''); }
function cleanName(n){ return (n||"").replace(/\s*\(Gast\)\s*$/,""); }

function renderRanking(cur, prevPos){
  if(!cur.length){ $("#rankingView").innerHTML='<div class="card"><div class="empty">Noch keine Spieler in der Wertung.</div></div>'; return; }
  $("#rankingView").innerHTML =
    '<div class="card"><table>'+
    '<thead><tr><th>Pl.</th><th>Trend</th><th>Spieler</th><th class="r hide-sm">Vorwoche</th><th class="r">Punkte</th><th class="r hide-sm">Turniere</th></tr></thead><tbody>'+
    cur.map((r,i)=>
      '<tr class="'+(i===0?"top1":"")+'">'+
        '<td class="pos">'+(i+1)+'</td>'+
        trendCell(r.name, i+1, prevPos)+
        '<td>'+pn(r.name)+'</td>'+
        '<td class="prev hide-sm">'+(prevPos[r.name]!=null?prevPos[r.name]+".":"&ndash;")+'</td>'+
        '<td class="pts">'+nfmt(r.sum)+'</td>'+
        '<td class="cnt hide-sm">'+r.count+'</td>'+
      '</tr>').join("")+
    '</tbody></table></div>';
}
function renderTournaments(events, resByEvent){
  if(!events.length){ $("#turniereView").innerHTML='<div class="card"><div class="empty">Keine Turniere.</div></div>'; return; }
  $("#turniereView").innerHTML = events.map(function(e){
    const rows=(resByEvent[e.id]||[]).slice().sort((a,b)=>a.rank-b.rank);
    return '<div class="card">'+
      '<div class="tourn-head"><span>'+esc(e.name||"Turnier")+'</span><span class="date">'+fdate(e.event_date)+'</span></div>'+
      '<table><thead><tr><th>Platz</th><th>Spieler</th><th class="r">Punkte</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td class="pos">'+r.rank+'</td><td>'+pn(r.name)+'</td><td class="pts">'+nfmt(r.points)+'</td></tr>').join("")+
      '</tbody></table></div>';
  }).join("");
}
function openPlayer(name){
  const rows = ALL_RESULTS.filter(r=>r.name===name).map(r=>{
    const ev=EVMAP[r.event_id]||{}; return { ev:ev.name||"Turnier", date:ev.event_date||"", rank:r.rank, points:Number(r.points) };
  }).sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  const best4 = rows.map(r=>r.points).sort((a,b)=>b-a).slice(0,4).reduce((a,b)=>a+b,0);
  const guest=/\(Gast\)\s*$/.test(name);
  $("#pmName").innerHTML = esc(cleanName(name)) + (guest?' <span class="gtag">Gast</span>':'');
  $("#pmInfo").innerHTML = rows.length? (rows.length+" erfasste Turniere &middot; beste 4: <strong>"+nfmt(best4)+"</strong> Punkte") : "Keine erfassten Turniere.";
  let body = rows.length? (
    '<table><thead><tr><th>Turnier</th><th class="hide-sm">Datum</th><th class="r">Platz</th><th class="r">Punkte</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.ev)+'</td><td class="hide-sm" style="color:var(--muted);font-size:13px">'+fdate(r.date)+'</td><td class="pts">'+r.rank+'.</td><td class="pts">'+nfmt(r.points)+'</td></tr>').join("")+
    '</tbody></table>') : "";
  // Direkter Vergleich
  CUR_H2H=h2hFor(name); CUR_NAME=name;
  const opps=Object.keys(CUR_H2H).sort((a,b)=>a.localeCompare(b,"de"));
  if(opps.length){
    body += '<div class="h2h-head">Direkter Vergleich</div>'+
      '<select id="h2hSel"><option value="">Gegner wählen…</option>'+
      opps.map(o=>'<option value="'+esc(o)+'">'+esc(cleanName(o))+'</option>').join("")+'</select>'+
      '<div id="h2hResult"></div>';
  }
  $("#pmBody").innerHTML = body;
  const sel=document.getElementById("h2hSel");
  if(sel) sel.addEventListener("change", ()=>renderH2H(sel.value));
  $("#playerModal").classList.remove("hidden");
}
function renderH2H(opp){
  const box=document.getElementById("h2hResult"); if(!box) return;
  if(!opp){ box.innerHTML=""; return; }
  const r=CUR_H2H[opp]||{w:0,l:0,sf:0,sa:0,bf:0,ba:0,games:[]}; const total=r.w+r.l;
  const games=r.games.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  box.innerHTML =
    '<div class="h2h-card">'+
      '<span class="nm r">'+esc(cleanName(CUR_NAME))+'</span>'+
      '<span class="sc">'+r.w+' : '+r.l+'</span>'+
      '<span class="nm">'+esc(cleanName(opp))+'</span>'+
    '</div>'+
    '<div class="h2h-stats">'+
      '<div class="st-item"><span class="v">'+r.w+' : '+r.l+'</span><span class="l">Spiele</span></div>'+
      '<div class="st-item"><span class="v">'+r.sf+' : '+r.sa+'</span><span class="l">Sätze</span></div>'+
      '<div class="st-item"><span class="v">'+r.bf+' : '+r.ba+'</span><span class="l">Punkte</span></div>'+
    '</div>'+
    (games.length? ('<table style="margin-top:6px"><thead><tr><th>Turnier</th><th class="hide-sm">Datum</th><th class="r">Sätze</th><th class="r">Punkte</th><th class="r">Erg.</th></tr></thead><tbody>'+
      games.map(g=>'<tr><td>'+esc(g.ev)+'</td><td class="hide-sm" style="color:var(--muted);font-size:13px">'+fdate(g.date)+'</td><td class="pts">'+g.mS+':'+g.oS+'</td><td class="pts">'+g.mB+':'+g.oB+'</td><td class="pts" style="color:'+(g.won?'var(--up)':'var(--down)')+'">'+(g.won?'S':'N')+'</td></tr>').join("")+
      '</tbody></table>') : "");
}
$("#pmClose").addEventListener("click", ()=>$("#playerModal").classList.add("hidden"));
$("#playerModal").addEventListener("click", e=>{ if(e.target.id==="playerModal") $("#playerModal").classList.add("hidden"); });
document.addEventListener("click", e=>{ const el=e.target.closest("[data-player]"); if(el) openPlayer(el.dataset.player); });

function showView(v){
  const on = v==="turniere" ? "turniere":"ranking";
  $("#rankingView").style.display  = on==="ranking"?"":"none";
  $("#turniereView").style.display = on==="turniere"?"":"none";
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.view===on));
  if(location.hash.replace("#","")!==on) history.replaceState(null,"", "#"+on);
}

async function load(){
  if(!cfg.url || !cfg.anonKey){ renderSite(); $("#rankingView").innerHTML='<div class="card"><div class="empty">config.js fehlt.</div></div>'; return; }
  const sb = supabase.createClient(cfg.url, cfg.anonKey);
  try{ const b=await sb.from("public_branding").select("value").maybeSingle();
    const v=b.data&&b.data.value; if(v&&(v.owner||v.version)){ const f=document.getElementById("foot"); if(f) f.textContent = `© ${v.owner||""} ${v.year||""} · Version ${v.version||""} · SC Yellow Dot Maintal e.V.`.replace(/\s+/g," ").trim(); }
  }catch(e){}
  // Banner & Sponsoren aus den App-Einstellungen (überschreibt die Vorgaben oben)
  try{ const rs = await sb.from("public_ranking_site").select("value").maybeSingle();
       let v = rs.data ? rs.data.value : null;
       if(typeof v==="string"){ try{ v=JSON.parse(v); }catch(e){} }
       if(v && typeof v==="object") window.SITE = Object.assign({}, window.SITE, v);
  }catch(e){}
  renderSite();
  const res1 = await sb.from("public_ranking_events")
    .select("id,name,event_date,finalized_at")
    .order("event_date",{ascending:false}).order("finalized_at",{ascending:false});
  if(res1.error){ $("#rankingView").innerHTML='<div class="card"><div class="empty">Fehler beim Laden.</div></div>'; return; }
  const events = res1.data||[];
  if(!events.length){ $("#rankingView").innerHTML='<div class="card"><div class="empty">Noch keine Ranglistenturniere ver&ouml;ffentlicht.</div></div>'; return; }
  EVMAP={}; events.forEach(e=> EVMAP[e.id]=e);

  const res2 = await sb.from("public_ranking_results").select("event_id,name,rank,points").limit(5000);
  ALL_RESULTS = res2.data||[];
  try{ const h=await sb.from("public_h2h").select("*").limit(20000); ALL_H2H=h.data||[]; }catch(e){ ALL_H2H=[]; }
  const resByEvent={}; ALL_RESULTS.forEach(r=> (resByEvent[r.event_id]=resByEvent[r.event_id]||[]).push(r));

  const ids = events.map(e=>e.id);
  const current = ranking(ids.slice(0,10), resByEvent);
  const previous = ranking(ids.slice(1,11), resByEvent);
  const prevPos = {}; previous.forEach((r,i)=> prevPos[r.name]=i+1);

  renderRanking(current, prevPos);
  renderTournaments(events.slice(0,10), resByEvent);
  $("#seg").style.display = "inline-flex";
  document.querySelectorAll("#seg button").forEach(b=> b.addEventListener("click", ()=>showView(b.dataset.view)) );
  showView(location.hash.replace("#","")||"ranking");

  $("#updated").textContent = "Stand: "+new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"});
  clearTimeout(window.__t); window.__t=setTimeout(()=>{ if($("#playerModal").classList.contains("hidden")) location.reload(); }, 60000);
}
load();
</script>
</body>
</html>
